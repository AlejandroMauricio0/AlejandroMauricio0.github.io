<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" preserveAspectRatio="xMinYMax slice" fill="none">
  <!-- Guías angulares del tapete de corte: 30°, 45° y 60° desde el origen inferior izquierdo -->
  <g stroke="#ffffff" stroke-opacity="0.16" stroke-width="1">
    <line x1="120" y1="860" x2="1332" y2="160" stroke-dasharray="10 8"/>
    <line x1="120" y1="860" x2="1110" y2="-130" stroke-dasharray="10 8"/>
    <line x1="120" y1="860" x2="820" y2="-352" stroke-dasharray="10 8"/>
    <!-- Ejes de origen -->
    <line x1="120" y1="860" x2="1440" y2="860" stroke-opacity="0.22"/>
    <line x1="120" y1="860" x2="120" y2="0" stroke-opacity="0.22"/>
  </g>

  <!-- Transportador -->
  <g stroke="#ffffff" stroke-opacity="0.2">
    <path d="M380 860 A260 260 0 0 0 120 600" stroke-width="1"/>
    <path d="M300 860 A180 180 0 0 0 120 680" stroke-width="1" stroke-opacity="0.12"/>
    <!-- Marcas cada 15° sobre el arco -->
    <g stroke-width="1.2">
      <line x1="371" y1="793" x2="383" y2="789"/>
      <line x1="345" y1="730" x2="356" y2="724"/>
      <line x1="304" y1="676" x2="313" y2="667"/>
      <line x1="250" y1="635" x2="256" y2="624"/>
      <line x1="187" y1="609" x2="190" y2="597"/>
    </g>
  </g>
  <g fill="#ffffff" fill-opacity="0.38" font-family="JetBrains Mono, Consolas, monospace" font-size="13" letter-spacing="1">
    <text x="392" y="702">30°</text>
    <text x="340" y="640">45°</text>
    <text x="276" y="590">60°</text>
    <text x="134" y="848" font-size="11" fill-opacity="0.3">0,0</text>
  </g>

  <!-- Círculo de referencia superior derecho -->
  <g stroke="#ffffff" stroke-opacity="0.1">
    <circle cx="1240" cy="200" r="150"/>
    <circle cx="1240" cy="200" r="100" stroke-dasharray="4 6"/>
    <line x1="1060" y1="200" x2="1420" y2="200"/>
    <line x1="1240" y1="20" x2="1240" y2="380"/>
  </g>
</svg>
